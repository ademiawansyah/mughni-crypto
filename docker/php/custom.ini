; Custom PHP configuration for Fotoria
; Increases upload limits for photo uploads

upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Imagick resource limits (prevent runaway memory/threads)
; Adjust based on workload and container memory
; Docs: https://imagemagick.org/script/resources.php
; Limit memory used by pixel cache and processing
imagick.resource_limit = 256
; Limit number of image pixels (e.g., 10000 MP)
imagick.pixel_cache_limit = 10000000000
; Limit threads used by OpenMP (1-2 for predictable usage)
imagick.thread_limit = 2
; Prefer WebP encoder quality defaults via env or code; keep defaults here
