services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: 1000
        USER_GID: 1000
    image: al_mughni:local
    container_name: al_mughni
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/var/www/html:delegated
      - composer-cache:/tmp/composer
    networks:
      - dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NOTE: do NOT declare postgres_db / redis_db here — main-service supplies them on the external network.

  nginx:
    image: nginx:1.25
    container_name: al_mughni_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d:ro
    networks:
      - dev-network
    depends_on:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: al_mughni_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles:
      - cloudflare
    networks:
      - dev-network
    depends_on:
      - nginx

networks:
  dev-network:
    external: true

volumes:
  composer-cache:
