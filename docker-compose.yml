services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: 1000
        USER_GID: 1000
    image: al_mughni:local
    container_name: al_mughni
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
      - composer-cache:/tmp/composer
    networks:
      - dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    # NOTE: do NOT declare postgres_db / redis_db here — main-service supplies them on the external network.

  app_public_sync:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: 1000
        USER_GID: 1000
    image: al_mughni:local
    user: "0:0"
    command: ["/var/www/html/public", "/srv/public"]
    entrypoint: ["/usr/local/bin/sync-public-assets.sh"]
    restart: "no"
    volumes:
      - public-assets:/srv/public

  nginx:
    image: nginx:1.25
    container_name: al_mughni_nginx
    restart: unless-stopped
    volumes:
      - public-assets:/var/www/html/public:ro
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d:ro
    networks:
      - dev-network
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: al_mughni_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - dev-network
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  dev-network:
    external: true

volumes:
  public-assets:
  composer-cache:
