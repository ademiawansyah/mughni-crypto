name: Redeploy on main merge

on:
  pull_request:
    types:
      - closed

concurrency:
  group: redeploy-main
  cancel-in-progress: false

jobs:
  redeploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'

    steps:
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "${SSH_HOST}" ]]; then
            echo "Missing SSH_HOST secret"
            exit 1
          fi

          if [[ -z "${SSH_USER}" ]]; then
            echo "Missing SSH_USER secret"
            exit 1
          fi

          if [[ -z "${SSH_PRIVATE_KEY}" ]]; then
            echo "Missing SSH_PRIVATE_KEY secret"
            exit 1
          fi

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"

          if [[ -n "${SSH_KNOWN_HOSTS}" ]]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          else
            ssh-keyscan -p "${SSH_PORT:-22}" "${SSH_HOST}" > "${HOME}/.ssh/known_hosts"
          fi

          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Pull latest code and refresh services
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail

          ssh -i "${HOME}/.ssh/id_ed25519" -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            'set -euo pipefail && cd /home/edualima/code/mughni-crypto && git pull --ff-only origin main && make refresh'
